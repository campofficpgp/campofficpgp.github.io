<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انٹرنیٹ نہیں / No connection</title>
<meta name="theme-color" content="#17294a">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{display:flex;align-items:center;justify-content:center;padding:16px;background:#17294a;color:#fff;font-family:'Segoe UI',Tahoma,Arial,sans-serif;text-align:center;}
  .card{max-width:420px;width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);border-radius:14px;padding:28px 22px;}
  img{height:64px;width:auto;margin-bottom:12px;}
  h1{font-size:20px;margin:0 0 10px;}
  p{margin:6px 0;font-size:14px;line-height:1.9;color:#e4e9f5;}
  button{margin-top:16px;background:#B8860B;color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:15px;cursor:pointer;}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px;}
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="">
    <h1>انٹرنیٹ کنکشن نہیں ہے</h1>
    <p>یہ ایپ ڈیٹا انٹرنیٹ سے لیتی ہے۔ کنکشن بحال ہونے پر دوبارہ کوشش کریں۔</p>
    <p dir="ltr">No internet connection. Please try again when you are back online.</p>
    <button type="button" onclick="location.reload()">دوبارہ کوشش / Retry</button>
  </div>
</body>
</html>
