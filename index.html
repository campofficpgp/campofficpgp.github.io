<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camp Office Suite | کیمپ آفس سویٹ</title>
<meta http-equiv="refresh" content="0; url=https://cmpofficepgp.org/camp-office-suite/">
<link rel="canonical" href="https://cmpofficepgp.org/camp-office-suite/">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif; background:#0f2a4a;
    color:#fff; text-align:center; padding:24px;
  }
  .box{max-width:420px;}
  .spinner{
    width:40px; height:40px; margin:0 auto 20px; border-radius:50%;
    border:4px solid rgba(255,255,255,.25); border-top-color:#fff;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{font-size:20px; margin:0 0 8px;}
  p{font-size:14px; opacity:.85; margin:0 0 16px;}
  a{color:#fff; text-decoration:underline;}
</style>
<script>
  window.location.replace("https://cmpofficepgp.org/camp-office-suite/");
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>کیمپ آفس سویٹ لوڈ ہو رہا ہے… / Loading Camp Office Suite…</h1>
    <p>اگر خود بخود نہ کھلے تو یہاں کلک کریں / If it doesn't open automatically, click here:</p>
    <a href="https://cmpofficepgp.org/camp-office-suite/">cmpofficepgp.org/camp-office-suite/</a>
  </div>
</body>
</html>
